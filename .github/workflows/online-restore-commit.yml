name: Commit Verified Great White Online

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'ONLINE_RESTORE_REQUEST.md'

permissions:
  contents: write

jobs:
  restore-online:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect already-restored branch
        id: state
        run: |
          if [ -f app/src/main/java/tv/own/owntv/features/online/OnlineScreen.kt ] && \
             grep -q 'ONLINE(tv.own.owntv.R.string.common_nav_online)' app/src/main/java/tv/own/owntv/features/shell/ShellViewModel.kt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        if: steps.state.outputs.ready != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        if: steps.state.outputs.ready != 'true'
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        if: steps.state.outputs.ready != 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore isolated Online source files
        if: steps.state.outputs.ready != 'true'
        run: |
          set -euo pipefail
          git fetch origin greatwhite-online
          git checkout origin/greatwhite-online -- \
            app/src/main/java/tv/own/owntv/features/online/OnlineAddonStore.kt \
            app/src/main/java/tv/own/owntv/features/online/OnlineScreen.kt \
            app/src/main/java/tv/own/owntv/features/online/StremioAddonClient.kt

      - name: Patch Online into current main navigation
        if: steps.state.outputs.ready != 'true'
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          online = 'app/src/main/java/tv/own/owntv/features/online/OnlineScreen.kt'
          replace_once(online, 'import androidx.compose.foundation.layout.weight\n', '')
          replace_once(online,
              '    val context = LocalContext.current\n    val colors = OwnTVTheme.colors',
              '    val context = LocalContext.current\n    val externalOpenFailedText = stringResource(R.string.online_external_open_failed)\n    val colors = OwnTVTheme.colors')
          replace_once(online,
              '                                                    context.getString(R.string.online_external_open_failed),',
              '                                                    externalOpenFailedText,')
          replace_once(online,
              '''        ) {\n            Column(Modifier.weight(1f)) {\n                Text(\n                    text = stringResource(R.string.online_title),''',
              '''        ) {\n            Column(Modifier.fillMaxWidth(0.46f)) {\n                Text(\n                    text = stringResource(R.string.online_title),''')
          replace_once(online,
              '                            modifier = Modifier.weight(0.9f).fillMaxHeight(),',
              '                            modifier = Modifier.fillMaxWidth(0.40f).fillMaxHeight(),')
          replace_once(online,
              '                            modifier = Modifier.weight(1.25f).fillMaxHeight(),',
              '                            modifier = Modifier.fillMaxWidth(0.58f).fillMaxHeight(),')
          replace_once(online,
              '''                    Column(Modifier.weight(1f)) {\n                        Text(addon.name,''',
              '''                    Column(Modifier.fillMaxWidth(0.72f)) {\n                        Text(addon.name,''')

          shell_vm = 'app/src/main/java/tv/own/owntv/features/shell/ShellViewModel.kt'
          replace_once(shell_vm,
              '    SERIES(tv.own.owntv.R.string.common_nav_series),\n    DOWNLOADS(tv.own.owntv.R.string.common_nav_downloads),',
              '    SERIES(tv.own.owntv.R.string.common_nav_series),\n    ONLINE(tv.own.owntv.R.string.common_nav_online),\n    DOWNLOADS(tv.own.owntv.R.string.common_nav_downloads),')
          replace_once(shell_vm,
              'val browseOrder: List<MainSection> = listOf(HOME, LIVE_TV, MOVIES, SERIES, DOWNLOADS, EPG)',
              'val browseOrder: List<MainSection> = listOf(HOME, LIVE_TV, MOVIES, SERIES, ONLINE, DOWNLOADS, EPG)')
          replace_once(shell_vm,
              '            add(HOME)\n            if (hasLive)',
              '            add(HOME)\n            add(ONLINE)\n            if (hasLive)')

          shell = 'app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt'
          replace_once(shell,
              'import tv.own.owntv.features.movies.MovieViewModel\n',
              'import tv.own.owntv.features.movies.MovieViewModel\nimport tv.own.owntv.features.online.OnlineScreen\n')
          replace_once(shell,
              '''                        selectedSection == MainSection.DOWNLOADS -> DownloadsScreen(\n                            onFullscreen = { openFullscreen() },''',
              '''                        selectedSection == MainSection.ONLINE -> OnlineScreen(\n                            onPlayDirect = { item, episode, url ->\n                                val displayTitle = episode?.let { "${item.name} · ${it.title}" } ?: item.name\n                                player.play(\n                                    url,\n                                    title = displayTitle,\n                                    year = item.year,\n                                    isLive = false,\n                                    contentKey = "ONLINE:${item.type}:${episode?.id ?: item.id}",\n                                )\n                                openFullscreen(MainSection.ONLINE)\n                            },\n                            onChildFocused = { focusedLayer = ShellLayer.CONTENT },\n                            modifier = Modifier.fillMaxSize(),\n                        )\n\n                        selectedSection == MainSection.DOWNLOADS -> DownloadsScreen(\n                            onFullscreen = { openFullscreen() },''')
          replace_once(shell,
              '        MainSection.SERIES -> OwnTVIcon.SERIES\n        MainSection.DOWNLOADS -> OwnTVIcon.DOWNLOADS',
              '        MainSection.SERIES -> OwnTVIcon.SERIES\n        MainSection.ONLINE -> OwnTVIcon.MOVIES\n        MainSection.DOWNLOADS -> OwnTVIcon.DOWNLOADS')
          replace_once(shell,
              '    MainSection.EPG -> emptyList()\n    MainSection.LIVE_TV -> listOf(',
              '    MainSection.EPG -> emptyList()\n    MainSection.ONLINE -> emptyList()\n    MainSection.LIVE_TV -> listOf(')
          replace_once(shell,
              '    MainSection.SEARCH, MainSection.HOME, MainSection.EPG, MainSection.SETTINGS -> ""',
              '    MainSection.SEARCH, MainSection.HOME, MainSection.ONLINE, MainSection.EPG, MainSection.SETTINGS -> ""')

          icon = 'app/src/main/java/tv/own/owntv/ui/components/NavDuotoneIcon.kt'
          replace_once(icon,
              '            MainSection.MOVIES -> {',
              '            MainSection.MOVIES, MainSection.ONLINE -> {')

          sidebar = 'app/src/main/java/tv/own/owntv/features/shell/components/Sidebar.kt'
          replace_once(sidebar,
              '        MainSection.MOVIES -> OwnTVIcon.MOVIES\n        MainSection.SERIES -> OwnTVIcon.SERIES\n        MainSection.DOWNLOADS -> OwnTVIcon.DOWNLOADS',
              '        MainSection.MOVIES -> OwnTVIcon.MOVIES\n        MainSection.SERIES -> OwnTVIcon.SERIES\n        MainSection.ONLINE -> OwnTVIcon.MOVIES\n        MainSection.DOWNLOADS -> OwnTVIcon.DOWNLOADS')

          Path('app/src/main/res/values/strings_online.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="common_nav_online">Online</string>\n    <string name="online_title">Great White Online</string>\n    <string name="online_subtitle">Browse no-login online catalogs and available direct web sources.</string>\n    <string name="online_movies">Movies</string>\n    <string name="online_series">Series</string>\n    <string name="online_sources">Sources</string>\n    <string name="online_loading">Loading Online…</string>\n    <string name="online_error">Online could not load right now. Try again.</string>\n    <string name="online_empty">No titles found.</string>\n    <string name="online_source_cinemeta">Online catalog</string>\n    <string name="online_item_no_description">No description is available.</string>\n    <string name="online_choose_episode">Choose an episode</string>\n    <string name="online_loading_episodes">Loading episodes…</string>\n    <string name="online_no_episodes">No episodes found.</string>\n    <string name="online_available_streams">Available sources</string>\n    <string name="online_no_streams">No direct web source is available for this title from the enabled providers.</string>\n    <string name="online_loading_streams">Checking enabled providers…</string>\n    <string name="online_external_open_failed">Could not open that source on this device.</string>\n    <string name="online_sources_title">Online Sources</string>\n    <string name="online_sources_subtitle">Great White includes default no-login sources. Advanced users can add compatible provider manifests.</string>\n    <string name="online_source_url_hint">Provider manifest URL</string>\n    <string name="online_source_add">Add source</string>\n    <string name="online_source_checking">Checking source…</string>\n    <string name="online_source_added">Source added.</string>\n    <string name="online_source_invalid">That source is not a compatible provider.</string>\n    <string name="online_source_builtin">Built in</string>\n    <string name="online_source_remove">Remove</string>\n    <string name="online_search_hint">Search Online…</string>\n</resources>\n''', encoding='utf-8')
          PY

      - name: Refresh reviewed technical literal classifications
        if: steps.state.outputs.ready != 'true'
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          checker_path = Path('tools/i18n/check_hardcoded_strings.py')
          spec = importlib.util.spec_from_file_location('i18n_checker', checker_path)
          checker = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(checker)

          current = checker._inventory()
          safe, categories, errors = checker._safe_entries()
          if errors:
              raise SystemExit('\n'.join(errors))

          entries = {}
          for key, count in safe.items():
              actual = current.get(key, 0)
              if actual > 0:
                  entries[key] = (min(count, actual), categories[key])

          technical_paths = {
              'app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt',
              'app/src/main/java/tv/own/owntv/features/online/OnlineAddonStore.kt',
              'app/src/main/java/tv/own/owntv/features/online/OnlineScreen.kt',
              'app/src/main/java/tv/own/owntv/features/online/StremioAddonClient.kt',
          }
          shell_path = 'app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt'
          shell_technical = {
              '${item.name} · ${it.title}',
              'ONLINE:${item.type}:${episode?.id ?: item.id}',
          }

          for key, count in current.items():
              path, text = key
              if path in technical_paths or (path == shell_path and text in shell_technical):
                  entries[key] = (count, 'empty' if text == '' else 'technical')

          checker.SAFE_MANIFEST.write_text(checker._serialize_safe(entries), encoding='utf-8')
          safe_counts = {key: count for key, (count, _category) in entries.items()}
          checker.BASELINE.write_text(
              checker._serialize(checker._subtract_counts(current, safe_counts)),
              encoding='utf-8',
          )
          PY
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap

      - name: Guard app identity and changed-file isolation
        if: steps.state.outputs.ready != 'true'
        run: |
          set -euo pipefail
          grep -F 'applicationId = "tv.own.owntv"' app/build.gradle.kts
          grep -F 'const val REPO = "boberthegr8/GreatWhiteTV-Own"' app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt
          grep -F 'GreatWhiteTV.apk' app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt
          allowed='^(app/src/main/java/tv/own/owntv/features/online/(OnlineAddonStore|OnlineScreen|StremioAddonClient)\.kt|app/src/main/java/tv/own/owntv/features/shell/ShellViewModel\.kt|app/src/main/java/tv/own/owntv/features/shell/OwnTVShell\.kt|app/src/main/java/tv/own/owntv/features/shell/components/Sidebar\.kt|app/src/main/java/tv/own/owntv/ui/components/NavDuotoneIcon\.kt|app/src/main/res/values/strings_online\.xml)$'
          bad=$(git diff --name-only HEAD -- app | grep -Ev "$allowed" || true)
          if [ -n "$bad" ]; then
            echo "Unexpected app files changed:"
            echo "$bad"
            exit 1
          fi
          echo 'Only Online + the minimal navigation/player bridge changed under app/.'

      - name: Unit test, compile and lint current app
        if: steps.state.outputs.ready != 'true'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest assembleStandardDebug lintStandardDebug --stacktrace

      - name: Commit verified Online patch to PR branch
        if: steps.state.outputs.ready != 'true'
        run: |
          set -euo pipefail
          rm -f ONLINE_RESTORE_REQUEST.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/src/main/java/tv/own/owntv/features/online \
            app/src/main/java/tv/own/owntv/features/shell/ShellViewModel.kt \
            app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt \
            app/src/main/java/tv/own/owntv/features/shell/components/Sidebar.kt \
            app/src/main/java/tv/own/owntv/ui/components/NavDuotoneIcon.kt \
            app/src/main/res/values/strings_online.xml \
            tools/i18n/safe_literals.txt \
            tools/i18n/hardcoded_baseline.txt \
            ONLINE_RESTORE_REQUEST.md
          git commit -m 'Restore isolated Great White Online'
          git push origin HEAD:${{ github.head_ref }}

      - name: Confirm already-restored branch
        if: steps.state.outputs.ready == 'true'
        run: |
          grep -F 'applicationId = "tv.own.owntv"' app/build.gradle.kts
          test -f app/src/main/java/tv/own/owntv/features/online/OnlineScreen.kt
          echo 'Online is already committed on this branch.'
