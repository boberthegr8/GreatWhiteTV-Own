name: Secure GWS Online v1.0.10 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/GWS_SECURE_V110_TRIGGER'

permissions:
  contents: write

concurrency:
  group: gws-secure-v110
  cancel-in-progress: false

env:
  VERSION_NAME: '1.0.10'
  VERSION_CODE: '10010'
  EXPECTED_CERT_SHA256: 'EDD594E18F5DAC75B6A15727E2D19CE54DADE3FD2B90B7AE5346E4FD83CCC81C'
  GH_TOKEN: ${{ github.token }}

jobs:
  secure-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish run-specific one-time public key
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/gws_ephemeral_private.pem 2>/dev/null
          openssl pkey -in /tmp/gws_ephemeral_private.pem -pubout -out /tmp/gws_ephemeral_public.pem 2>/dev/null
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/gws-handoff
          cp /tmp/gws_ephemeral_public.pem ".github/gws-handoff/public-${GITHUB_RUN_ID}.pem"
          printf '%s\n' "$GITHUB_RUN_ID" > .github/GWS_V110_ACTIVE_RUN.txt
          git config user.name 'GWS Secure Release'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/gws-handoff .github/GWS_V110_ACTIVE_RUN.txt
          git commit -m "Publish one-time GWS v1.0.10 public key for run ${GITHUB_RUN_ID} [skip ci]"
          git push origin HEAD:main

      - name: Wait for this run's encrypted signing bundle
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 240); do
            git fetch -q origin main
            P=".github/gws-handoff/payload-${GITHUB_RUN_ID}.b64"
            K=".github/gws-handoff/key-${GITHUB_RUN_ID}.b64"
            I=".github/gws-handoff/iv-${GITHUB_RUN_ID}.hex"
            if git show "origin/main:$P" > /tmp/payload.b64 2>/dev/null \
              && git show "origin/main:$K" > /tmp/aeskey.b64 2>/dev/null \
              && git show "origin/main:$I" > /tmp/iv.hex 2>/dev/null; then
              found=1
              break
            fi
            sleep 5
          done
          test "$found" = '1'

      - name: Decrypt and verify recovered signing bundle
        run: |
          set -euo pipefail
          base64 -d /tmp/aeskey.b64 > /tmp/aeskey.enc
          base64 -d /tmp/payload.b64 > /tmp/payload.enc
          openssl pkeyutl -decrypt \
            -inkey /tmp/gws_ephemeral_private.pem \
            -in /tmp/aeskey.enc \
            -out /tmp/aeskey.bin \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          AES_HEX=$(od -An -tx1 -v /tmp/aeskey.bin | tr -d ' \n')
          IV_HEX=$(tr -d '[:space:]' < /tmp/iv.hex)
          openssl enc -d -aes-256-cbc -K "$AES_HEX" -iv "$IV_HEX" -in /tmp/payload.enc -out /tmp/signing-bundle.zip
          mkdir -p /tmp/gws-signing
          unzip -q /tmp/signing-bundle.zip -d /tmp/gws-signing
          test -s /tmp/gws-signing/signing/GreatWhiteTV-release.jks
          test -s /tmp/gws-signing/signing.env
          set -a
          . /tmp/gws-signing/signing.env
          set +a
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          CERT=$(
            keytool -list -v \
              -keystore /tmp/gws-signing/signing/GreatWhiteTV-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" 2>/dev/null \
              | awk -F': ' '/SHA256:/{gsub(":","",$2); print toupper($2); exit}'
          )
          test "$CERT" = "$EXPECTED_CERT_SHA256"
          echo "Recovered signing certificate verified: $CERT"
          echo 'KEYSTORE_FILE=/tmp/gws-signing/signing/GreatWhiteTV-release.jks' >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed GWS Online APK
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          test -s "$ARM_SRC"
          echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"

      - name: Verify final APK signing identity
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$APKSIGNER"
          ACTUAL=$(
            "$APKSIGNER" verify --print-certs "$ARM_SRC" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
          echo "Signed APK certificate verified: $ACTUAL"
          echo "APK_CERT_SHA256=$ACTUAL" >> "$GITHUB_ENV"

      - name: Prepare GWS Online release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$ARM_SRC" dist/GWSOnline.apk
          cp "$ARM_SRC" dist/GWSOnline-v1.0.10.apk
          cp "$ARM_SRC" dist/GreatWhiteTV.apk
          cp "$ARM_SRC" dist/OwnTV.apk
          sha256sum dist/GWSOnline.apk | awk '{print $1}' > /tmp/gws_sha256
          cp /tmp/gws_sha256 dist/GWSOnline.sha256

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GWSOnline-v1.0.10-signed
          path: |
            dist/GWSOnline.apk
            dist/GWSOnline-v1.0.10.apk
            dist/GWSOnline.sha256
          if-no-files-found: error

      - name: Publish GWS Online v1.0.10 release
        run: |
          set -euo pipefail
          if gh release view v1.0.10 >/dev/null 2>&1; then
            gh release upload v1.0.10 \
              dist/GWSOnline.apk dist/GWSOnline-v1.0.10.apk \
              dist/GreatWhiteTV.apk dist/OwnTV.apk dist/GWSOnline.sha256 --clobber
            gh release edit v1.0.10 \
              --title 'GWS Online v1.0.10' \
              --notes $'GWS Online v1.0.10\n\n- Updates are manual only.\n- Change Provider DNS preserves username/password and forces playlist + EPG refresh.\n- Online section restored/evolved.' \
              --latest
          else
            gh release create v1.0.10 \
              dist/GWSOnline.apk dist/GWSOnline-v1.0.10.apk \
              dist/GreatWhiteTV.apk dist/OwnTV.apk dist/GWSOnline.sha256 \
              --target main \
              --title 'GWS Online v1.0.10' \
              --notes $'GWS Online v1.0.10\n\n- Updates are manual only.\n- Change Provider DNS preserves username/password and forces playlist + EPG refresh.\n- Online section restored/evolved.' \
              --latest
          fi

      - name: Verify public Downloader URLs byte-for-byte
        run: |
          set -euo pipefail
          EXPECTED=$(cat /tmp/gws_sha256)
          VERSIONED='https://github.com/boberthegr8/GreatWhiteTV-Own/releases/download/v1.0.10/GWSOnline.apk'
          LATEST='https://github.com/boberthegr8/GreatWhiteTV-Own/releases/latest/download/GWSOnline.apk'
          for URL in "$VERSIONED" "$LATEST"; do
            ok=0
            for i in $(seq 1 18); do
              if curl -fL --connect-timeout 15 --max-time 120 -A 'Downloader/1.5' "$URL" -o /tmp/downloader-test.apk; then
                GOT=$(sha256sum /tmp/downloader-test.apk | awk '{print $1}')
                if [ "$GOT" = "$EXPECTED" ]; then
                  ok=1
                  break
                fi
              fi
              sleep 5
            done
            test "$ok" = '1'
            echo "Public URL verified byte-for-byte: $URL"
          done
          echo 'PUBLIC_URLS_OK=true' >> "$GITHUB_ENV"

      - name: Record result and securely clean this run's handoff files
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/GWS_SECURE_V110_TRIGGER
          rm -f .github/GWS_V110_ACTIVE_RUN.txt
          rm -f ".github/gws-handoff/public-${GITHUB_RUN_ID}.pem"
          rm -f ".github/gws-handoff/payload-${GITHUB_RUN_ID}.b64"
          rm -f ".github/gws-handoff/key-${GITHUB_RUN_ID}.b64"
          rm -f ".github/gws-handoff/iv-${GITHUB_RUN_ID}.hex"
          rmdir .github/gws-handoff 2>/dev/null || true
          rm -f .github/workflows/gws-secure-release-v110.yml
          {
            echo 'version=1.0.10'
            echo "run_id=$GITHUB_RUN_ID"
            echo "apk_cert_sha256=${APK_CERT_SHA256:-unavailable}"
            echo "public_urls_ok=${PUBLIC_URLS_OK:-false}"
          } > .github/GWS_V110_RELEASE_STATUS.txt
          printf '1.0.10\n' > GWS_VERSION
          git config user.name 'GWS Secure Release'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Record GWS Online v1.0.10 secure release result [skip ci]' || true
          git push origin HEAD:main

      - name: Assert release complete
        if: always()
        run: |
          test "${APK_CERT_SHA256:-}" = "$EXPECTED_CERT_SHA256"
          test "${PUBLIC_URLS_OK:-}" = 'true'
