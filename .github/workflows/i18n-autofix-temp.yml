name: Temporary i18n autofix

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  fix:
    if: github.head_ref == 'agent/i18n-autofix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh reviewed technical literal inventory
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path

          script = Path('tools/i18n/check_hardcoded_strings.py')
          spec = importlib.util.spec_from_file_location('i18ncheck', script)
          m = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)

          current = m._inventory()
          baseline = m._parse(m.BASELINE.read_text(encoding='utf-8'))
          safe, categories, errors = m._safe_entries()
          if errors:
              raise SystemExit('\n'.join(errors))

          safe = {
              key: min(count, current.get(key, 0))
              for key, count in safe.items()
              if current.get(key, 0) > 0
          }
          categories = {key: categories[key] for key in safe}
          reviewed = {
              'app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt',
              'app/src/main/java/tv/own/owntv/features/update/UpdateDialog.kt',
              'app/src/main/java/tv/own/owntv/features/update/UpdateStatusToast.kt',
              'app/src/main/java/tv/own/owntv/features/settings/DnsSettingsScreen.kt',
              'app/src/main/java/tv/own/owntv/features/online/InternetArchivePublicDomainClient.kt',
              'app/src/main/java/tv/own/owntv/features/online/OnlineScreen.kt',
              'app/src/main/java/tv/own/owntv/features/online/OnlineAddonStore.kt',
          }
          classified = m._add_counts(baseline, safe)
          mime_values = {
              'application/json',
              'application/vnd.android.package-archive',
              'application/vnd.github+json',
          }
          header_values = {'Accept', 'User-Agent', 'GreatWhiteTV', 'GreatWhiteOnline/1'}
          format_values = {'"', '\\', '\\"', '\\\\', '%20', '%2F', '+', '/', '.mp4', '.m4v', 'mpeg4', 'mpeg-4', 'h.264'}

          for key, count in current.items():
              path, text = key
              if path not in reviewed or count <= classified.get(key, 0):
                  continue
              safe[key] = count
              if text == '':
                  category = 'empty'
              elif text in mime_values:
                  category = 'mime'
              elif text in header_values:
                  category = 'header'
              elif text.startswith('http://') or text.startswith('https://'):
                  category = 'url'
              elif text in {'http://', 'https://'}:
                  category = 'protocol'
              elif text in format_values:
                  category = 'format'
              elif text == 'UNUSED_PARAMETER':
                  category = 'library'
              elif text in {'provider_dns_change', 'greatwhite.publicdomain'}:
                  category = 'id'
              elif path.endswith('UpdateManager.kt') and 'failed' in text:
                  category = 'log'
              else:
                  category = 'api'
              categories[key] = category

          entries = {key: (count, categories[key]) for key, count in safe.items()}
          m.SAFE_MANIFEST.write_text(m._serialize_safe(entries), encoding='utf-8')
          if m.cmd_generate(None) != 0:
              raise SystemExit('Could not regenerate hardcoded baseline')
          PY
      - name: Regenerate supported locale metadata
        run: python3 tools/i18n/gen_supported_locales.py
      - name: Verify i18n after regeneration
        run: |
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap
          python3 tools/i18n/gen_supported_locales.py check
          python3 tools/i18n/validate_strings.py --report text
      - name: Upload generated files
        uses: actions/upload-artifact@v4
        with:
          name: greatwhite-i18n-generated
          path: |
            tools/i18n/safe_literals.txt
            tools/i18n/hardcoded_baseline.txt
            app/src/main/java/tv/own/owntv/core/i18n/SupportedLocales.kt
          if-no-files-found: error
