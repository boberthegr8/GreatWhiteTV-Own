name: Finalize Great White v1.0.7

on:
  push:
    branches: [ main ]
    paths:
      - '.github/FINALIZE_V107'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Clean temporary release helpers and set final version
        run: |
          set -euo pipefail
          rm -f .github/workflows/v106-signed-apk-artifact.yml
          rm -f .github/workflows/v106-fast-signed-apk.yml
          rm -f .github/workflows/v106-main-signed-apk.yml
          rm -f .github/workflows/v106-direct-release.yml
          rm -f .github/workflows/v106-observable-release.yml
          rm -f .github/workflows/greatwhite-release.yml
          rm -f .github/BUILD_SIGNED_V106
          rm -f .github/PUBLISH_CORRECTED_V106
          rm -f .github/RUN_OBSERVABLE_V106
          rm -f .github/V106_RELEASE_STATUS.txt
          rm -f .github/FINALIZE_V107
          rm -f .github/workflows/finalize-v107.yml
          printf '1.0.7\n' > GWS_VERSION
      - name: Commit final release trigger
        run: |
          set -euo pipefail
          git config user.name "Great White CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Release Great White TV v1.0.7"
          git push origin HEAD:main
