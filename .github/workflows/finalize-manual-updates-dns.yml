name: Finalize manual updates and Change DNS

on:
  push:
    branches: [ main ]
    paths:
      - '.github/FINALIZE_MANUAL_UPDATES_DNS'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final Settings cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/tv/own/owntv/features/shell/components/SettingsScreen.kt')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '    val updateCheckOnStart by settingsVm.updateCheckOnStart.collectAsStateWithLifecycle()\n',
                  '',
              ),
              (
                  '''        SettingsRow(\n            tone = TileTone.SECONDARY, icon = OwnTVIcon.SEARCH,\n            title = stringResource(R.string.settings_dns),\n            desc = stringResource(R.string.settings_dns_description),\n            onClick = { open(SettingsTab.DNS) }, showChevron = true,\n            modifier = Modifier.focusRequester(rowFocus.getValue(SettingsTab.DNS)),\n        )\n''',
                  '''        SettingsRow(\n            tone = TileTone.PRIMARY, icon = OwnTVIcon.SEARCH,\n            title = stringResource(R.string.settings_provider_dns_root_title),\n            desc = stringResource(R.string.settings_provider_dns_root_description),\n            onClick = { open(SettingsTab.DNS) }, showChevron = true,\n            modifier = Modifier.focusRequester(rowFocus.getValue(SettingsTab.DNS)),\n        )\n''',
              ),
              (
                  '''        SettingsRow(\n            tone = TileTone.SECONDARY, icon = OwnTVIcon.HISTORY,\n            title = stringResource(R.string.settings_update_startup), desc = stringResource(R.string.settings_update_startup_description),\n            chip = if (updateCheckOnStart) stringResource(R.string.common_on) else stringResource(R.string.common_off),\n            chipTone = if (updateCheckOnStart) TileTone.PRIMARY else TileTone.SECONDARY,\n            onClick = { settingsVm.setUpdateCheckOnStart(!updateCheckOnStart) },\n        )\n''',
                  '',
              ),
              (
                  '''                SettingsSearchEntry(stringResource(R.string.settings_group_network), stringResource(R.string.settings_dns), stringResource(R.string.settings_search_keywords_dns), OwnTVIcon.SEARCH, TileTone.SECONDARY) { open(SettingsTab.DNS) },\n''',
                  '''                SettingsSearchEntry(stringResource(R.string.settings_group_network), stringResource(R.string.settings_provider_dns_root_title), stringResource(R.string.settings_search_keywords_dns), OwnTVIcon.SEARCH, TileTone.PRIMARY) { open(SettingsTab.DNS) },\n''',
              ),
              (
                  '''                SettingsSearchEntry(stringResource(R.string.settings_group_app), stringResource(R.string.settings_update_startup), stringResource(R.string.settings_search_keywords_update_auto), OwnTVIcon.HISTORY, TileTone.SECONDARY,\n                    chip = if (updateCheckOnStart) stringResource(R.string.common_on) else stringResource(R.string.common_off), chipTone = if (updateCheckOnStart) TileTone.PRIMARY else TileTone.SECONDARY, showChevron = false) { settingsVm.setUpdateCheckOnStart(!updateCheckOnStart) },\n''',
                  '',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected SettingsScreen snippet was not found; refusing blind edit.\n' + old[:180])
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          strings = Path('app/src/main/res/values/strings_greatwhite_controls.xml')
          s = strings.read_text(encoding='utf-8')
          marker = '</resources>'
          if marker not in s:
              raise SystemExit('strings resource closing tag missing')
          addition = '''    <string name="settings_provider_dns_root_title">Change DNS</string>\n    <string name="settings_provider_dns_root_description">Only use this if you are told to. Keeps the username and password the same, then refreshes the playlist and EPG.</string>\n'''
          if 'settings_provider_dns_root_title' not in s:
              s = s.replace(marker, addition + marker)
          strings.write_text(s, encoding='utf-8')
          PY

      - name: Remove temporary validation files
        run: |
          rm -f .github/I18N_AUTOFIX_MAIN_TRIGGER.md
          rm -f app/src/main/res/values-v1/greatwhite_manual_update_override.xml
          rm -f .github/workflows/i18n-autofix-temp.yml
          rm -f .github/FINALIZE_MANUAL_UPDATES_DNS
          rm -f .github/workflows/finalize-manual-updates-dns.yml
          rmdir app/src/main/res/values-v1 2>/dev/null || true

      - name: Commit finalized app changes
        run: |
          set -euo pipefail
          git config user.name "Great White CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize manual updates and Change DNS UI [skip ci]"
          git push origin HEAD:main
