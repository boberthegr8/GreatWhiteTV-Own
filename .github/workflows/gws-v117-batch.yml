name: GWS v1.0.17 batch validation

on:
  push:
    branches: [ gws-v117-batch ]
    paths:
      - '.github/GWS_V117_BATCH_TRIGGER'

permissions:
  contents: write

concurrency:
  group: gws-v117-batch
  cancel-in-progress: false

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: gws-v117-batch
          fetch-depth: 0

      - name: Apply v1.0.17 batch patch
        run: |
          python3 .github/scripts/gws_v117_patch.py
          python3 .github/scripts/gws_v117_post_patch.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Release compile gate
        run: |
          env -u KEYSTORE_FILE -u KEYSTORE_PASSWORD -u KEY_ALIAS -u KEY_PASSWORD \
            ./gradlew :app:assembleStandardRelease --stacktrace

      - name: Commit green batch
        run: |
          set -euo pipefail
          git config user.name 'GWS v1.0.17 Batch'
          git config user.email 'actions@users.noreply.github.com'
          git add app/src/main tools/i18n/safe_literals.txt
          git diff --cached --check
          git commit -m 'GWS v1.0.17 batch: guide overlay, playback and polish'
          git push origin HEAD:gws-v117-batch
