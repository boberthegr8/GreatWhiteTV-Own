name: GWS signing secret availability check

on:
  push:
    branches: [ main ]
    paths:
      - '.github/GWS_SIGNING_SECRET_CHECK_TRIGGER'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 != '' }}
      HAS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD != '' }}
      HAS_KEY_ALIAS: ${{ secrets.KEY_ALIAS != '' }}
      HAS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD != '' }}
      HAS_SIGNING_BUNDLE: ${{ secrets.GREATWHITE_TV_SIGNING_BUNDLE != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record secret availability only
        run: |
          set -euo pipefail
          {
            echo "keystore_base64=$HAS_KEYSTORE_BASE64"
            echo "keystore_password=$HAS_KEYSTORE_PASSWORD"
            echo "key_alias=$HAS_KEY_ALIAS"
            echo "key_password=$HAS_KEY_PASSWORD"
            echo "signing_bundle=$HAS_SIGNING_BUNDLE"
          } > .github/GWS_SIGNING_SECRET_STATUS.txt
          rm -f .github/GWS_SIGNING_SECRET_CHECK_TRIGGER
          git config user.name 'GWS Signing Check'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/GWS_SIGNING_SECRET_STATUS.txt .github/GWS_SIGNING_SECRET_CHECK_TRIGGER
          git commit -m 'Record GWS signing secret availability [skip ci]'
          git push origin HEAD:main
