name: Great White Online

on:
  push:
    branches: ["greatwhite-online"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "1.0.0"
      VERSION_CODE: "10000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Apply Great White Online identity and features
        run: python3 tools/gws/prepare_online_build.py

      - name: Validate standalone identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'applicationId = "com.greatwhitestreams.online"' app/build.gradle.kts
          grep -q 'android:label="Great White Online"' app/src/main/AndroidManifest.xml
          grep -q 'android:scheme="greatwhiteonline"' app/src/main/AndroidManifest.xml
          grep -q 'ONLINE(tv.own.owntv.R.string.common_nav_online)' app/src/main/java/tv/own/owntv/features/shell/ShellViewModel.kt
          grep -q 'http://hush.iptv:80' app/src/main/java/tv/own/owntv/core/companion/CompanionHtml.kt
          grep -q 'http://cvapp.tv:8000' app/src/main/java/tv/own/owntv/core/companion/CompanionHtml.kt
          test -f app/src/main/java/tv/own/owntv/features/online/OnlineScreen.kt
          test -f app/src/main/java/tv/own/owntv/features/online/StremioAddonClient.kt

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:testStandardDebugUnitTest -x verifyI18nLiterals

      - name: Build Fire TV / Android TV test APK
        run: ./gradlew :app:assembleStandardDebug -x verifyI18nLiterals

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: GreatWhiteOnline-test
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      - name: Build unsigned optimized release APK
        run: ./gradlew :app:assembleStandardRelease -x verifyI18nLiterals

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: GreatWhiteOnline-unsigned-release
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
