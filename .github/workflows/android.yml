name: Android CI

# Tests every change, builds APKs from main, and publishes permanently signed releases.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version to publish (example: 1.0.8). Leave blank for a dev build."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Lint
        if: always()
        run: ./gradlew lintStandardDebug --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      MANUAL_VERSION: ${{ github.event.inputs.release_version || '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_version != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release GWS Online v')) }}
      APK_OUT: ""
      EXPECTED_CERT_SHA256: "EDD594E18F5DAC75B6A15727E2D19CE54DADE3FD2B90B7AE5346E4FD83CCC81C"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compute version
        id: ver
        run: |
          set -euo pipefail
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [ -n "$MANUAL_VERSION" ]; then
            NAME="${MANUAL_VERSION#v}"
          elif [ "$IS_RELEASE" = "true" ] && [ "$GITHUB_EVENT_NAME" = "push" ]; then
            test -s GWS_VERSION
            NAME="$(tr -d '[:space:]' < GWS_VERSION)"
          else
            NAME="99.99.99"
          fi

          if [ "$IS_RELEASE" = "true" ]; then
            if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release version must be X.Y.Z, for example 1.0.8"
              exit 1
            fi
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( MA * 10000 + MI * 100 + PA ))
            [ "$CODE" -gt 0 ] || CODE=1
          else
            CODE=99999
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE); release=$IS_RELEASE"

      - name: Restore permanent GWS Online signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          GREATWHITE_TV_SIGNING_BUNDLE: ${{ secrets.GREATWHITE_TV_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            if [ -z "$KEYSTORE_PASSWORD_SECRET" ] || [ -z "$KEY_ALIAS_SECRET" ] || [ -z "$KEY_PASSWORD_SECRET" ]; then
              echo "::error::KEYSTORE_BASE64 is configured but one or more signing credential secrets are missing."
              exit 1
            fi
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "::add-mask::$KEYSTORE_PASSWORD_SECRET"
            echo "::add-mask::$KEY_PASSWORD_SECRET"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Permanent signing restored from existing repository secrets."
          elif [ -n "$GREATWHITE_TV_SIGNING_BUNDLE" ]; then
            mkdir -p "$RUNNER_TEMP/gws-signing"
            printf '%s' "$GREATWHITE_TV_SIGNING_BUNDLE" | base64 --decode > "$RUNNER_TEMP/gws-signing.zip"
            unzip -q "$RUNNER_TEMP/gws-signing.zip" -d "$RUNNER_TEMP/gws-signing"
            test -s "$RUNNER_TEMP/gws-signing/signing/GreatWhiteTV-release.jks"
            test -s "$RUNNER_TEMP/gws-signing/signing.env"
            set -a
            . "$RUNNER_TEMP/gws-signing/signing.env"
            set +a
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/gws-signing/signing/GreatWhiteTV-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Permanent signing restored from compatibility signing bundle."
          else
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Refusing to publish a GWS Online release without the permanent signing key."
              exit 1
            fi
            echo "No signing secret configured — non-release build will use debug signing."
          fi

      - name: Derive the release edge key
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY_SECRET: ${{ secrets.OWNTV_EDGE_KEY }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            KEY=$(printf '%s' "$VERSION_NAME" \
              | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex \
              | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
          elif [ -n "$OWNTV_EDGE_KEY_SECRET" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY_SECRET"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          chmod +x ./gradlew
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            echo "Building permanently signed release APKs"
            ./gradlew assembleRelease --stacktrace
            ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
            X86_SRC=$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)
            echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"
            echo "X86_SRC=$X86_SRC" >> "$GITHUB_ENV"
          else
            echo "Building debug APK"
            ./gradlew assembleDebug --stacktrace
            SRC=$(ls app/build/outputs/apk/standard/debug/*.apk | head -n1)
            echo "ARM_SRC=$SRC" >> "$GITHUB_ENV"
          fi

      - name: Verify permanent APK signing identity
        if: env.KEYSTORE_FILE != ''
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$ARM_SRC"
          ACTUAL=$(
            "$APKSIGNER" verify --print-certs "$ARM_SRC" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK signer mismatch. Refusing to publish an APK that cannot update existing GWS Online installs."
            echo "Expected: $EXPECTED_CERT_SHA256"
            echo "Actual:   $ACTUAL"
            exit 1
          fi
          echo "Verified permanent GWS Online signing certificate: $ACTUAL"

      - name: Name the APK
        run: |
          mkdir -p dist
          if [ "$IS_RELEASE" = "true" ]; then
            OUT="GWSOnline-v${{ steps.ver.outputs.name }}.apk"
          else
            OUT="GWSOnline-dev-${GITHUB_SHA::7}.apk"
          fi
          cp "$ARM_SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          if [ "$IS_RELEASE" = "true" ]; then
            # Primary public/download/updater filename.
            cp "$ARM_SRC" "dist/GWSOnline.apk"
            # Compatibility aliases only. Older installed builds may still request these names;
            # they are byte-for-byte the same signed GWS Online APK.
            cp "$ARM_SRC" "dist/GreatWhiteTV.apk"
            cp "$ARM_SRC" "dist/OwnTV.apk"
            if [ -n "${X86_SRC:-}" ]; then
              cp "$X86_SRC" "dist/GWSOnline-x86_64-v${{ steps.ver.outputs.name }}.apk"
            fi
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

      - name: Extract release notes from CHANGELOG_APP.md
        if: env.IS_RELEASE == 'true'
        env:
          TAG: v${{ steps.ver.outputs.name }}
        run: |
          if [ -f CHANGELOG_APP.md ]; then
            awk -v ver="$TAG" '
              $0 ~ ("^## " ver "([ \t]|$)") { flag=1; next }
              /^## v/ && flag { flag=0 }
              flag { print }
            ' CHANGELOG_APP.md > dist/RELEASE_NOTES.md || true
            sed -i -e '/./,$!d' dist/RELEASE_NOTES.md
            awk 'NF{p=NR} {a[NR]=$0} END{for(i=1;i<=p;i++) print a[i]}' \
              dist/RELEASE_NOTES.md > dist/RELEASE_NOTES.trimmed.md
            mv dist/RELEASE_NOTES.trimmed.md dist/RELEASE_NOTES.md
          fi
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "GWS Online $TAG update." > dist/RELEASE_NOTES.md
          fi
          cat dist/RELEASE_NOTES.md

      - name: Publish GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: GWS Online v${{ steps.ver.outputs.name }}
          files: |
            dist/${{ env.APK_OUT }}
            dist/GWSOnline.apk
            dist/GreatWhiteTV.apk
            dist/OwnTV.apk
            dist/GWSOnline-x86_64-v${{ steps.ver.outputs.name }}.apk
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: false
