name: Build GWS Stremio

on:
  push:
    branches: [ gws-stremio ]
    paths:
      - '.github/workflows/gws-stremio.yml'
      - 'gws-stremio/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Clone upstream Stremio Native Android
        run: git clone --depth 1 --recurse-submodules https://github.com/stremio-native/stremio-android.git stremio-src

      - name: Apply Great White identity
        working-directory: stremio-src
        shell: bash
        run: |
          set -e
          # Keep Kotlin namespace intact; change only install identity so it can coexist with Stremio.
          sed -i 's/applicationId = "com.stremio.mobile"/applicationId = "tv.gws.stremio"/' app/build.gradle.kts
          # Keep Firebase libraries required by source, but disable google-services package processing for the GWS package.
          sed -i '/id("com.google.gms.google-services")/d' app/build.gradle.kts
          # Remove Firebase/Performance/PostHog completely. Renaming applicationId without a matching Google app config
          # leaves package-bound Firebase components in the merged manifest and can crash during process startup.
          sed -i '/id("com.google.firebase.crashlytics")/d' app/build.gradle.kts
          sed -i '/id("com.google.firebase.firebase-perf")/d' app/build.gradle.kts
          # Keep runtime libraries because MainViewModel still references their APIs.
          # Their Gradle plugins and Application startup initialization remain disabled.
          # GWS fork: remove upstream Firebase/PostHog telemetry startup so the renamed package can launch independently.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/stremio/mobile/MainApplication.kt")
          s=p.read_text()
          s=s.replace("import com.google.firebase.crashlytics.FirebaseCrashlytics\n", "")
          s=s.replace("import com.posthog.android.PostHogAndroid\n", "")
          s=s.replace("import com.posthog.android.PostHogAndroidConfig\n", "")
          start=s.find("class CrashlyticsTree : Timber.Tree()")
          end=s.find("class MainApplication", start)
          if start != -1 and end != -1:
              s=s[:start]+s[end:]
          s=s.replace("        Timber.plant(CrashlyticsTree())\n", "")
          start=s.find("        val analyticsEnabled = container.authRepository.isAnalyticsEnabled()")
          end=s.find("\n\n    }", start)
          if start != -1 and end != -1:
              s=s[:start]+s[end:]
          p.write_text(s)
          PY
          sed -i 's/<string name="app_name">[^<]*<\/string>/<string name="app_name">Great White Stremio<\/string>/' app/src/main/res/values/strings.xml || true
          # TV launcher support without removing normal phone launcher.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android.software.leanback' not in s:
              s=s.replace('<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n    <uses-feature android:name="android.software.leanback" android:required="false" />\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" />')
          if 'android.intent.category.LEANBACK_LAUNCHER' not in s:
              marker='<category android:name="android.intent.category.LAUNCHER" />'
              s=s.replace(marker, marker+'\n                <category android:name="android.intent.category.LEANBACK_LAUNCHER" />')
          p.write_text(s)
          PY

      - name: Build universal debug APK
        working-directory: stremio-src
        run: chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace

      - name: Collect universal and ARM APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find stremio-src/app/build/outputs/apk/debug -type f -name '*.apk' -print
          UNIVERSAL=$(find stremio-src/app/build/outputs/apk/debug -type f -name '*universal*debug*.apk' | head -1)
          ARM64=$(find stremio-src/app/build/outputs/apk/debug -type f -name '*arm64-v8a*debug*.apk' | head -1)
          ARM32=$(find stremio-src/app/build/outputs/apk/debug -type f -name '*armeabi-v7a*debug*.apk' | head -1)
          test -n "$UNIVERSAL" && test -f "$UNIVERSAL"
          test -n "$ARM64" && test -f "$ARM64"
          test -n "$ARM32" && test -f "$ARM32"
          cp "$UNIVERSAL" out/gws-stremio-universal-test.apk
          cp "$ARM64" out/gws-stremio-arm64-test.apk
          cp "$ARM32" out/gws-stremio-arm32-test.apk
          sha256sum out/*.apk > out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: gws-stremio-test
          path: out/*
