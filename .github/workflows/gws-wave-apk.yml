name: GWS Wave preview APK

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-wave-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GWS Wave branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Wave service presets
        run: python3 tools/gws_wave_service_presets.py

      - name: Commit generated Wave source change
        shell: bash
        run: |
          if ! git diff --quiet -- app/src/main/java/tv/own/owntv/features/setup/AddSourceScreen.kt; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add app/src/main/java/tv/own/owntv/features/setup/AddSourceScreen.kt
            git commit -m "GWS Wave: add TV service and editable DNS selector"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Build isolated GWS Wave APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleStandardDebug --stacktrace

      - name: Stage APK
        shell: bash
        run: |
          mkdir -p wave-apk
          cp app/build/outputs/apk/standard/debug/app-standard-debug.apk wave-apk/GWS-Wave-Preview.apk

      - name: Upload GWS Wave APK
        uses: actions/upload-artifact@v4
        with:
          name: GWS-Wave-Preview-APK
          path: wave-apk/GWS-Wave-Preview.apk
          if-no-files-found: error
          retention-days: 30
