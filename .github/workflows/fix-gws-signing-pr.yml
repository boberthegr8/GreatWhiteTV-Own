name: Apply Great White Signing Repair

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'SIGNING_FIX_TRIGGER.md'

permissions:
  contents: write

jobs:
  patch-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch release workflows to original Great White signing lineage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def secret_ref(name: str) -> str:
              # Construct the GitHub expression at runtime so Actions cannot expand it inside this patch script.
              return '$' + '{{ secrets.' + name + ' }}'

          def patch(path: str):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if 'GWS_KEYSTORE_BASE64_SECRET:' in text:
                  print(f'{path}: GWS signing compatibility already present')
                  return

              step = text.index('      - name: Restore permanent Great White signing key')
              env_anchor = '        env:\n'
              env_pos = text.index(env_anchor, step) + len(env_anchor)
              env_insert = (
                  f'          GWS_KEYSTORE_BASE64_SECRET: {secret_ref("GWS_KEYSTORE_BASE64")}\n'
                  f'          GWS_KEYSTORE_PASSWORD_SECRET: {secret_ref("GWS_KEYSTORE_PASSWORD")}\n'
              )
              text = text[:env_pos] + env_insert + text[env_pos:]

              old_if = '          if [ -n "$KEYSTORE_BASE64" ]; then'
              if_pos = text.index(old_if, step)
              gws_branch = '''          if [ -n "$GWS_KEYSTORE_BASE64_SECRET" ]; then
            test -n "$GWS_KEYSTORE_PASSWORD_SECRET"
            printf '%s' "$GWS_KEYSTORE_BASE64_SECRET" | base64 --decode > "$RUNNER_TEMP/greatwhite-release.jks"
            echo "::add-mask::$GWS_KEYSTORE_PASSWORD_SECRET"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/greatwhite-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$GWS_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=greatwhite" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$GWS_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Permanent signing restored from original GWS release secrets."
          elif [ -n "$KEYSTORE_BASE64" ]; then'''
              text = text[:if_pos] + gws_branch + text[if_pos + len(old_if):]
              p.write_text(text, encoding='utf-8')
              print(f'{path}: original GWS signing lineage restored')

          patch('.github/workflows/android.yml')
          patch('.github/workflows/online-bootstrap.yml')
          PY

      - name: Commit signing repair and remove one-shot workflows
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-gws-signing.yml .github/workflows/fix-gws-signing-pr.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use original Great White signing credentials for releases'
          git push origin HEAD:main
