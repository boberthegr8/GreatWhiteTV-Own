name: Great White Streams TV

on:
  push:
    branches: ["gws-v1", "main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: greatwhite

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Apply Great White identity
        run: python3 tools/gws/prepare_build.py

      - name: Resolve build version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_NAME}" == "main" && -f GWS_VERSION ]]; then
            VERSION="$(tr -d '[:space:]' < GWS_VERSION)"
            if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "GWS_VERSION must be X.Y.Z" >&2
              exit 1
            fi
            IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
            CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "version_code=$CODE" >> "$GITHUB_OUTPUT"
          else
            # Development branch still uses the real first-release lineage so the APK Rob installs
            # today can be upgraded by 1.0.1+ instead of being stranded behind OwnTV's 99999 dev code.
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "version=1.0.0" >> "$GITHUB_OUTPUT"
            echo "version_code=10000" >> "$GITHUB_OUTPUT"
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # OwnTV's upstream translation literal inventory intentionally tracks upstream brand strings.
      # Great White carries technical fork identifiers, so this upstream-only QA gate is skipped
      # while the real Android/JVM unit tests still run normally.
      - name: Run unit tests
        run: ./gradlew :app:testStandardDebugUnitTest -x verifyI18nLiterals

      - name: Build test APK
        if: steps.version.outputs.release != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew :app:assembleStandardDebug -x verifyI18nLiterals

      - name: Upload test APK
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GreatWhiteTV-test
          path: app/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error

      # Produce an unsigned release package too. The first Great White signing identity is applied
      # privately after CI, so the private key never needs to be committed to this public GPL fork.
      - name: Build unsigned release APK for private signing
        if: steps.version.outputs.release != 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: ./gradlew :app:assembleStandardRelease -x verifyI18nLiterals

      - name: Upload unsigned release APK
        if: steps.version.outputs.release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GreatWhiteTV-unsigned-release
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error

      - name: Require permanent signing secrets
        if: steps.version.outputs.release == 'true'
        env:
          GWS_KEYSTORE_BASE64: ${{ secrets.GWS_KEYSTORE_BASE64 }}
          GWS_KEYSTORE_PASSWORD: ${{ secrets.GWS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$GWS_KEYSTORE_BASE64" ]] || { echo "Missing GWS_KEYSTORE_BASE64" >&2; exit 1; }
          [[ -n "$GWS_KEYSTORE_PASSWORD" ]] || { echo "Missing GWS_KEYSTORE_PASSWORD" >&2; exit 1; }
          printf '%s' "$GWS_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/greatwhite-release.jks"

      - name: Build permanently signed release APKs
        if: steps.version.outputs.release == 'true'
        env:
          VERSION_NAME: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_FILE: ${{ runner.temp }}/greatwhite-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.GWS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: greatwhite
          KEY_PASSWORD: ${{ secrets.GWS_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleStandardRelease :app:assembleX86_64Release -x verifyI18nLiterals

      - name: Prepare release APKs
        if: steps.version.outputs.release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          ARM_APK="$(find app/build/outputs/apk/standard/release -type f -name '*.apk' | head -1)"
          X86_APK="$(find app/build/outputs/apk/x86_64/release -type f -name '*.apk' | head -1)"
          test -n "$ARM_APK" && test -f "$ARM_APK"
          test -n "$X86_APK" && test -f "$X86_APK"
          VERSION='${{ steps.version.outputs.version }}'
          cp "$ARM_APK" "release/GreatWhiteTV-v${VERSION}.apk"
          cp "$ARM_APK" "release/GreatWhiteTV.apk"
          cp "$X86_APK" "release/GreatWhiteTV-x86_64-v${VERSION}.apk"
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Upload signed release artifacts
        if: steps.version.outputs.release == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: GreatWhiteTV-v${{ steps.version.outputs.version }}
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release if new
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the published release unchanged."
            exit 0
          fi
          gh release create "$TAG" \
            release/GreatWhiteTV-v${VERSION}.apk \
            release/GreatWhiteTV-x86_64-v${VERSION}.apk \
            release/GreatWhiteTV.apk \
            release/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "Great White Streams TV v${VERSION}" \
            --notes "Great White Streams TV v${VERSION}. Built from the OwnTV GPLv3 codebase with Great White branding, a separate Android application ID, and in-app updates from this repository."
