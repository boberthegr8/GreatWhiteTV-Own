name: GWS compile diagnostic

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile and capture diagnostics
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew compileStandardDebugKotlin --stacktrace > gws-compile.log 2>&1
          RESULT=$?
          tail -n 250 gws-compile.log > gws-compile-tail.log
          exit $RESULT
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gws-compile-diagnostics
          path: |
            gws-compile.log
            gws-compile-tail.log
          if-no-files-found: error
