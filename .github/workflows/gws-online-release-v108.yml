name: GWS Online v1.0.8 Release Builder

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  release:
    if: github.head_ref == 'agent/gws-online-release-v108'
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: "1.0.8"
      VERSION_CODE: "10008"
      EXPECTED_CERT_SHA256: "EDD594E18F5DAC75B6A15727E2D19CE54DADE3FD2B90B7AE5346E4FD83CCC81C"
    steps:
      - name: Checkout exact GWS Online release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Refresh GWS Online technical literal inventory
        run: |
          set -euo pipefail
          python3 tools/i18n/check_hardcoded_strings.py prune-safe
          python3 tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt \
            --text 'GWSOnline' \
            --category technical
          python3 tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt \
            --text 'GWSOnline.apk' \
            --category file-path
          python3 tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt \
            --text 'gws-online-update.apk' \
            --category file-path
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap

      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Restore permanent GWS Online signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          GREATWHITE_TV_SIGNING_BUNDLE: ${{ secrets.GREATWHITE_TV_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD_SECRET"
            test -n "$KEY_ALIAS_SECRET"
            test -n "$KEY_PASSWORD_SECRET"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "::add-mask::$KEYSTORE_PASSWORD_SECRET"
            echo "::add-mask::$KEY_PASSWORD_SECRET"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
          elif [ -n "$GREATWHITE_TV_SIGNING_BUNDLE" ]; then
            mkdir -p "$RUNNER_TEMP/gws-signing"
            printf '%s' "$GREATWHITE_TV_SIGNING_BUNDLE" | base64 --decode > "$RUNNER_TEMP/gws-signing.zip"
            unzip -q "$RUNNER_TEMP/gws-signing.zip" -d "$RUNNER_TEMP/gws-signing"
            test -s "$RUNNER_TEMP/gws-signing/signing/GreatWhiteTV-release.jks"
            test -s "$RUNNER_TEMP/gws-signing/signing.env"
            set -a
            . "$RUNNER_TEMP/gws-signing/signing.env"
            set +a
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/gws-signing/signing/GreatWhiteTV-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "::error::Permanent GWS Online signing key is unavailable."
            exit 1
          fi

      - name: Build signed GWS Online APK
        run: |
          ./gradlew assembleRelease --stacktrace
          ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          test -s "$ARM_SRC"
          echo "ARM_SRC=$ARM_SRC" >> "$GITHUB_ENV"

      - name: Verify update-compatible signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          test -x "$APKSIGNER"
          ACTUAL=$(
            "$APKSIGNER" verify --print-certs "$ARM_SRC" \
              | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' \
              | tr -d ':' \
              | tr '[:lower:]' '[:upper:]'
          )
          echo "Signer: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signer mismatch; refusing to publish an APK that cannot update installed GWS Online copies."
            exit 1
          fi

      - name: Prepare Downloader-friendly filenames
        run: |
          mkdir -p dist
          cp "$ARM_SRC" "dist/GWSOnline.apk"
          cp "$ARM_SRC" "dist/GWSOnline-v1.0.8.apk"
          # Compatibility aliases let older in-app updaters make the jump once.
          cp "$ARM_SRC" "dist/GreatWhiteTV.apk"
          cp "$ARM_SRC" "dist/OwnTV.apk"
          ls -lh dist

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GWSOnline-v1.0.8-signed
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GWS Online v1.0.8 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: GWS Online v1.0.8
          body: |
            GWS Online v1.0.8
            - Manual-only app update checks
            - Change Provider DNS while preserving username/password
            - Forces playlist and EPG refresh after provider DNS change
            - Restored/evolved Online section
          files: |
            dist/GWSOnline.apk
            dist/GWSOnline-v1.0.8.apk
            dist/GreatWhiteTV.apk
            dist/OwnTV.apk
          fail_on_unmatched_files: true
          overwrite_files: true
