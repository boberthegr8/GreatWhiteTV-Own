name: Export Great White Online APK

on:
  push:
    branches: ["greatwhite-online"]
    paths:
      - ".github/workflows/gwo-export-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download latest Online CI APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p export
          gh release download online-ci-latest \
            --pattern 'GreatWhiteOnline-v1.0.0-unsigned.apk' \
            --dir export
          test -s export/GreatWhiteOnline-v1.0.0-unsigned.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GreatWhiteOnline-export
          path: export/GreatWhiteOnline-v1.0.0-unsigned.apk
          if-no-files-found: error

      - name: Record run id
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci
          printf '%s\n' "$GITHUB_RUN_ID" > ci/online-export-run-id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/online-export-run-id.txt
          git commit -m "CI: record Online APK export run [skip ci]" || exit 0
          git push origin HEAD:greatwhite-online
