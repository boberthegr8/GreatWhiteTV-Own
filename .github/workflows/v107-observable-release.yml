name: Observable Great White v1.0.7 signed release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/RUN_V107_OBSERVABLE'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: 'EDD594E18F5DAC75B6A15727E2D19CE54DADE3FD2B90B7AE5346E4FD83CCC81C'
      VERSION_NAME: '1.0.7'
      VERSION_CODE: '10007'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Restore proven permanent signing key
        id: signing
        continue-on-error: true
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
          GREATWHITE_TV_SIGNING_BUNDLE: ${{ secrets.GREATWHITE_TV_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE_BASE64" ]; then
            test -n "$KEYSTORE_PASSWORD_SECRET"
            test -n "$KEY_ALIAS_SECRET"
            test -n "$KEY_PASSWORD_SECRET"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "::add-mask::$KEYSTORE_PASSWORD_SECRET"
            echo "::add-mask::$KEY_PASSWORD_SECRET"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "source=KEYSTORE_BASE64" >> "$GITHUB_OUTPUT"
          elif [ -n "$GREATWHITE_TV_SIGNING_BUNDLE" ]; then
            mkdir -p "$RUNNER_TEMP/greatwhite-signing"
            printf '%s' "$GREATWHITE_TV_SIGNING_BUNDLE" | base64 --decode > "$RUNNER_TEMP/greatwhite-signing.zip"
            unzip -q "$RUNNER_TEMP/greatwhite-signing.zip" -d "$RUNNER_TEMP/greatwhite-signing"
            test -s "$RUNNER_TEMP/greatwhite-signing/signing/GreatWhiteTV-release.jks"
            test -s "$RUNNER_TEMP/greatwhite-signing/signing.env"
            set -a
            . "$RUNNER_TEMP/greatwhite-signing/signing.env"
            set +a
            echo "::add-mask::$KEYSTORE_PASSWORD"
            echo "::add-mask::$KEY_PASSWORD"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/greatwhite-signing/signing/GreatWhiteTV-release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "source=GREATWHITE_TV_SIGNING_BUNDLE" >> "$GITHUB_OUTPUT"
          else
            echo "No established signing secret found" >&2
            exit 2
          fi

      - name: Derive release edge key
        if: steps.signing.outcome == 'success'
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY_SECRET: ${{ secrets.OWNTV_EDGE_KEY }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            KEY=$(printf '%s' "$VERSION_NAME" | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
          elif [ -n "$OWNTV_EDGE_KEY_SECRET" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY_SECRET"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Compile and verify signed release
        id: build
        if: steps.signing.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/v107-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then exit "$rc"; fi
          ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          X86_SRC=$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$ARM_SRC" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "Signer SHA-256: $ACTUAL" | tee -a /tmp/v107-build.log
          test "$ACTUAL" = "$EXPECTED_CERT_SHA256"
          mkdir -p dist
          cp "$ARM_SRC" dist/GreatWhiteTV-v1.0.7.apk
          cp "$ARM_SRC" dist/GreatWhiteTV.apk
          cp "$ARM_SRC" dist/OwnTV.apk
          cp "$X86_SRC" dist/GreatWhiteTV-x86_64-v1.0.7.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish release assets
        id: publish
        if: steps.signing.outcome == 'success' && steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          if gh release view v1.0.7 >/dev/null 2>&1; then
            gh release upload v1.0.7 dist/GreatWhiteTV-v1.0.7.apk dist/GreatWhiteTV.apk dist/OwnTV.apk dist/GreatWhiteTV-x86_64-v1.0.7.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create v1.0.7 \
              dist/GreatWhiteTV-v1.0.7.apk dist/GreatWhiteTV.apk dist/OwnTV.apk dist/GreatWhiteTV-x86_64-v1.0.7.apk dist/SHA256SUMS.txt \
              --target main \
              --title 'Great White TV v1.0.7' \
              --notes $'Great White TV v1.0.7\n\n- Updates are manual only; no automatic startup update check or prompt.\n- Check for updates remains an explicit Settings action.\n- Change DNS preserves the Xtream username/password and immediately refreshes playlist + EPG.'
          fi

      - name: Record result and remove one-shot workflow
        if: always()
        env:
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          SIGNING_SOURCE: ${{ steps.signing.outputs.source }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          rm -f .github/RUN_V107_OBSERVABLE
          rm -f .github/workflows/v107-observable-release.yml
          {
            echo "version=1.0.7"
            echo "signing_outcome=${SIGNING_OUTCOME:-unknown}"
            echo "signing_source=${SIGNING_SOURCE:-none}"
            echo "build_outcome=${BUILD_OUTCOME:-skipped}"
            echo "publish_outcome=${PUBLISH_OUTCOME:-skipped}"
            if [ -f /tmp/v107-build.log ]; then
              echo "--- build tail ---"
              tail -n 60 /tmp/v107-build.log
            fi
          } > .github/V107_RELEASE_STATUS.txt
          git config user.name "Great White CI"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Record v1.0.7 release result [skip ci]" || true
          git push origin HEAD:main

      - name: Assert release succeeded
        if: always()
        env:
          SIGNING_OUTCOME: ${{ steps.signing.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          test "$SIGNING_OUTCOME" = "success"
          test "$BUILD_OUTCOME" = "success"
          test "$PUBLISH_OUTCOME" = "success"
