name: One-shot GWS Online i18n main fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/GWS_I18N_FIX_TRIGGER.md'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Refresh GWS Online technical literal inventory
        run: |
          set -euo pipefail
          python3 tools/i18n/check_hardcoded_strings.py prune-safe
          python3 tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt \
            --text 'GWSOnline' \
            --category technical
          python3 tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt \
            --text 'GWSOnline.apk' \
            --category file-path
          python3 tools/i18n/check_hardcoded_strings.py classify-safe \
            --path app/src/main/java/tv/own/owntv/core/update/UpdateManager.kt \
            --text 'gws-online-update.apk' \
            --category file-path
          python3 tools/i18n/check_hardcoded_strings.py verify --bootstrap

      - name: Commit generated inventory and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "Great White CI"
          git config user.email "actions@users.noreply.github.com"
          git add tools/i18n/safe_literals.txt tools/i18n/hardcoded_baseline.txt
          git rm -f .github/GWS_I18N_FIX_TRIGGER.md .github/workflows/gws-i18n-main-fix.yml
          git commit -m "Fix GWS Online updater i18n inventory [skip ci]"
          git push origin HEAD:main
