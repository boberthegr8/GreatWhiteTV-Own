name: Observable corrected Great White v1.0.6 release

on:
  push:
    branches: [ main ]
    paths:
      - '.github/RUN_OBSERVABLE_V106'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: 'EDD594E18F5DAC75B6A15727E2D19CE54DADE3FD2B90B7AE5346E4FD83CCC81C'
      VERSION_NAME: '1.0.6'
      VERSION_CODE: '10006'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3

      - name: Restore permanent signing credentials
        id: signing
        env:
          GWS_KEYSTORE_BASE64_SECRET: ${{ secrets.GWS_KEYSTORE_BASE64 }}
          GWS_KEYSTORE_PASSWORD_SECRET: ${{ secrets.GWS_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$GWS_KEYSTORE_BASE64_SECRET" ] || [ -z "$GWS_KEYSTORE_PASSWORD_SECRET" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "reason=Permanent signing secret missing on main workflow" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$GWS_KEYSTORE_BASE64_SECRET" | base64 --decode > "$RUNNER_TEMP/greatwhite-release.jks"
          echo "::add-mask::$GWS_KEYSTORE_PASSWORD_SECRET"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/greatwhite-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$GWS_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=greatwhite" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$GWS_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Derive release edge key
        if: steps.signing.outputs.ok == 'true'
        env:
          OWNTV_EDGE_MASTER: ${{ secrets.OWNTV_EDGE_MASTER }}
          OWNTV_EDGE_KEY_SECRET: ${{ secrets.OWNTV_EDGE_KEY }}
        run: |
          if [ -n "$OWNTV_EDGE_MASTER" ]; then
            KEY=$(printf '%s' "$VERSION_NAME" | openssl dgst -sha256 -hmac "$OWNTV_EDGE_MASTER" -hex | awk '{print $NF}')
            echo "::add-mask::$KEY"
            echo "OWNTV_EDGE_KEY=$KEY" >> "$GITHUB_ENV"
          elif [ -n "$OWNTV_EDGE_KEY_SECRET" ]; then
            echo "::add-mask::$OWNTV_EDGE_KEY_SECRET"
            echo "OWNTV_EDGE_KEY=$OWNTV_EDGE_KEY_SECRET" >> "$GITHUB_ENV"
          fi

      - name: Build signed release APKs
        id: build
        if: steps.signing.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/greatwhite-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit "$rc"
          fi
          ARM_SRC=$(ls app/build/outputs/apk/standard/release/*.apk | head -n1)
          X86_SRC=$(ls app/build/outputs/apk/x86_64/release/*.apk | head -n1)
          test -f "$ARM_SRC" && test -f "$X86_SRC"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)
          ACTUAL=$("$APKSIGNER" verify --print-certs "$ARM_SRC" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')
          echo "Signer SHA-256: $ACTUAL" | tee -a /tmp/greatwhite-build.log
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signer mismatch" | tee -a /tmp/greatwhite-build.log
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 2
          fi
          mkdir -p dist
          cp "$ARM_SRC" dist/GreatWhiteTV-v1.0.6.apk
          cp "$ARM_SRC" dist/GreatWhiteTV.apk
          cp "$ARM_SRC" dist/OwnTV.apk
          cp "$X86_SRC" dist/GreatWhiteTV-x86_64-v1.0.6.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Publish or refresh v1.0.6 release
        id: publish
        if: steps.signing.outputs.ok == 'true' && steps.build.outcome == 'success' && steps.build.outputs.ok == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          if gh release view v1.0.6 >/dev/null 2>&1; then
            gh release upload v1.0.6 dist/GreatWhiteTV-v1.0.6.apk dist/GreatWhiteTV.apk dist/OwnTV.apk dist/GreatWhiteTV-x86_64-v1.0.6.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create v1.0.6 \
              dist/GreatWhiteTV-v1.0.6.apk dist/GreatWhiteTV.apk dist/OwnTV.apk dist/GreatWhiteTV-x86_64-v1.0.6.apk dist/SHA256SUMS.txt \
              --target main \
              --title 'Great White TV v1.0.6' \
              --notes $'Great White TV v1.0.6\n\n- Updates are manual only; no automatic startup check or prompt.\n- Check for updates remains an explicit Settings action.\n- Change DNS preserves Xtream username/password and immediately refreshes playlist + EPG.'
          fi

      - name: Write observable status back to main
        if: always()
        env:
          SIGNING_OK: ${{ steps.signing.outputs.ok }}
          SIGNING_REASON: ${{ steps.signing.outputs.reason }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_OK: ${{ steps.build.outputs.ok }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          {
            echo "version=1.0.6"
            echo "signing_ok=${SIGNING_OK:-false}"
            echo "build_outcome=${BUILD_OUTCOME:-skipped}"
            echo "build_ok=${BUILD_OK:-false}"
            echo "publish_outcome=${PUBLISH_OUTCOME:-skipped}"
            if [ -n "${SIGNING_REASON:-}" ]; then echo "reason=$SIGNING_REASON"; fi
            if [ -f /tmp/greatwhite-build.log ]; then
              echo "--- build tail ---"
              tail -n 80 /tmp/greatwhite-build.log
            fi
          } > .github/V106_RELEASE_STATUS.txt
          git config user.name "Great White CI"
          git config user.email "actions@users.noreply.github.com"
          git add .github/V106_RELEASE_STATUS.txt
          git commit -m "Record v1.0.6 release status [skip ci]" || true
          git push origin HEAD:main

      - name: Fail if release did not publish
        if: always()
        env:
          SIGNING_OK: ${{ steps.signing.outputs.ok }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          test "$SIGNING_OK" = "true"
          test "$BUILD_OUTCOME" = "success"
          test "$PUBLISH_OUTCOME" = "success"
